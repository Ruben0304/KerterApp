name: KerterWin (Windows)

on:
  workflow_dispatch:
  push:
    paths: ["KerterWin/**", ".github/workflows/kerterwin.yml"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Tests del núcleo
        run: dotnet test KerterWin/src/KerterCore.Tests --filter "FullyQualifiedName!~Strikeout_live"
      - name: Publicar
        run: >
          dotnet publish KerterWin/src/KerterWin/KerterWin.csproj -c Release -r win-x64
          -p:Platform=x64 --self-contained true -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: KerterWin-win-x64
          path: publish
